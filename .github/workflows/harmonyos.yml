name: Huawei HarmonyOS macOS Self-Hosted CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'harmonyos/**'
      - '.github/workflows/harmonyos.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'harmonyos/**'
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build cache before assembling'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build-harmonyos-hap:
    name: Build Huawei HarmonyOS HAP
    runs-on: [self-hosted, macOS]
    env:
      DEVECO_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk
      HOS_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      PATH: /Applications/DevEco-Studio.app/Contents/tools/node/bin:/Applications/DevEco-Studio.app/Contents/tools/hvigor/bin:/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains:${{ env.PATH }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify DevEco Studio & Hvigor Environment
        run: |
          echo "=== Checking DevEco Studio Environment ==="
          if [ ! -d "/Applications/DevEco-Studio.app" ]; then
            echo "::error::DevEco Studio not found at /Applications/DevEco-Studio.app! Please ensure DevEco Studio is installed on the runner host."
            exit 1
          fi
          echo "Node.js: $(node -v)"
          echo "Hvigor:  $(hvigorw --version)"
          echo "SDK:     $DEVECO_SDK_HOME"

      - name: Configure Huawei OpenHarmony Registry
        run: |
          echo "Configuring Huawei OpenHarmony NPM registry..."
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" > ~/.npmrc
          echo "strict-ssl=false" >> ~/.npmrc
          cat ~/.npmrc

      - name: Clean Previous Builds (Optional)
        if: ${{ github.event.inputs.clean_build == 'true' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd harmonyos
          hvigorw clean --no-daemon

      - name: Build HarmonyOS Ability Package (HAP)
        run: |
          cd harmonyos
          hvigorw --mode module -p module=entry@default -p product=default assembleHap --no-daemon

      - name: Locate & Verify Generated HAP
        id: find-hap
        run: |
          HAP_FILE=$(find harmonyos -name "*.hap" | head -n 1)
          if [ -z "$HAP_FILE" ] || [ ! -f "$HAP_FILE" ]; then
            echo "::error::Build succeeded but no .hap output file found!"
            exit 1
          fi
          echo "Generated HAP package: $HAP_FILE"
          ls -lh "$HAP_FILE"
          echo "hap_path=$HAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload HAP Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DakarRally-HarmonyOS-HAP
          path: ${{ steps.find-hap.outputs.hap_path }}
          retention-days: 30

      - name: Attach HAP to GitHub Release (on tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find-hap.outputs.hap_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
