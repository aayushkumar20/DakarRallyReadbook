name: Dakar CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JavaScript Syntax
        run: |
          node --check web/app.js

      - name: Validate JSON Strings File
        run: |
          python3 -m json.tool web/strings.json > /dev/null

      - name: Validate Project Configuration
        run: |
          ruby -ryaml -e "YAML.load_file('project.yml')" || (python3 -m pip install pyyaml --quiet && python3 -c "import yaml; yaml.safe_load(open('project.yml'))")

  build-ipa:
    name: Build & Package iOS IPA
    needs: code-quality
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project DakarRallyApp.xcodeproj \
            -scheme DakarRallyApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DakarRallyApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/DakarRallyApp.xcarchive/Products/Applications/DakarRallyApp.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../DakarRallyApp.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DakarRallyApp-IPA
          path: build/DakarRallyApp.ipa
          retention-days: 30

  deploy-pages:
    name: Deploy Web Companion to GitHub Pages
    needs: code-quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
