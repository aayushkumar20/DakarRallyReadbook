name: Dakar CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JavaScript Syntax
        run: |
          node --check web/app.js

      - name: Validate JSON Strings File
        run: |
          python3 -m json.tool web/strings.json > /dev/null

      - name: Validate Project Configuration
        run: |
          ruby -ryaml -e "YAML.load_file('project.yml')" || (python3 -m pip install pyyaml --quiet && python3 -c "import yaml; yaml.safe_load(open('project.yml'))")

  build-ipa:
    name: Build & Package iOS IPA
    needs: code-quality
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project DakarRallyApp.xcodeproj \
            -scheme DakarRallyApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DakarRallyApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/DakarRallyApp.xcarchive/Products/Applications/DakarRallyApp.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../DakarRallyApp.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DakarRallyApp-IPA
          path: build/DakarRallyApp.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Dakar Rally Roadbook v1.0.0"
          body: "Official Dakar Rally ERTF Unik4 & Digital Roadbook iOS IPA Release."
          files: build/DakarRallyApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy Web Companion to GitHub Pages
    needs: code-quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
